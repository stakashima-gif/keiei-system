let slideData=null;
function renderSlidesTab(el,ed){
  el.innerHTML=`
    <div class="card">
      <div class="field"><label>資料タイトル</label><input id="sl_title" placeholder="例:サービス提案資料"></div>
      <div class="field"><label>スライドにしたい内容・構成</label><textarea id="sl_in" rows="4" placeholder="例:当社のBPOサービスを紹介する提案資料。表紙/課題/解決策/導入効果/料金/導入の流れ/まとめ の7枚"></textarea></div>
      <div class="field two"><label>枚数の目安 / トーン</label><input id="sl_n" type="number" value="6"><select id="sl_tone"><option>ビジネス・簡潔</option><option>熱意・提案重視</option><option>丁寧・説明的</option></select></div>
      <button class="btn ai" id="sl_gen" onclick="doSlides()">✨ スライドを生成</button>
      <div class="ai-out" id="sl_status"></div>
      <div id="sl_preview"></div>
    </div>`;
  if(slideData) renderSlidePreview();
}
async function doSlides(){
  const title=fv('sl_title')||'プレゼン資料'; const btn=document.getElementById('sl_gen'); const st=document.getElementById('sl_status');
  const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> 生成中...'; st.className='ai-out show'; st.textContent='AIがスライドを構成中…';
  try{
    const raw=await aiComplete(
      `あなたはプレゼン資料構成のプロです。指定された内容から、スライドごとの構成をJSONで返します。各スライドは title と bullets(3-5個の短い箇条書き) を持ちます。出力はJSON配列のみ（説明・コードフェンス不要）。例:[{"title":"表紙","bullets":["サービス名","提案先","日付"]}]`,
      `タイトル:${title}\n枚数の目安:${fnum('sl_n')||6}\nトーン:${fv('sl_tone')}\n内容:\n${fv('sl_in')||'一般的な提案資料'}`,3000);
    let json=raw.trim().replace(/^```json?/i,'').replace(/```$/,'').trim();
    const m=json.match(/\[[\s\S]*\]/); if(m)json=m[0];
    slideData={title,slides:JSON.parse(json)};
    st.className='ai-out'; st.textContent='';
    renderSlidePreview();
  }catch(e){ st.className='ai-out show'; st.textContent='⚠️ '+(e.message||'生成に失敗しました。もう一度お試しください。'); }
  finally{ btn.disabled=false; btn.innerHTML=orig; }
}
function renderSlidePreview(){
  const el=document.getElementById('sl_preview'); if(!el||!slideData)return;
  el.innerHTML=`<div style="display:flex;gap:8px;margin:14px 0"><button class="btn" onclick="dlPptx()">⬇️ PPTXダウンロード</button><button class="btn ghost" onclick="printSlides()">🖨 PDF印刷</button></div>
    <div id="print-area"><div class="slide-deck">${slideData.slides.map(s=>`<div class="slide"><h2>${esc(s.title||'')}</h2><ul>${(s.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}</div></div>`;
}
async function dlPptx(){
  try{
    const res=await fetch('/api/pptx',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(slideData)});
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||('生成失敗 '+res.status)); }
    const blob=await res.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(slideData.title||'presentation')+'.pptx'; a.click(); toast('PPTXをダウンロードしました');
  }catch(e){ alert(e.message); }
}
function printSlides(){ printHTML(slideData.title,`<div class="slide-deck">${slideData.slides.map(s=>`<div class="slide"><h2>${esc(s.title||'')}</h2><ul>${(s.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}</div>`); }

//==================================================================
// 請求・入金管理
//==================================================================
function renderBilling(c,p){
  const ed=canEdit('billing');
  setHeader(p.title,p.sub,'');
  const invs=(STORE.documents||[]).filter(d=>d.type==='請求書').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const paid=invs.filter(d=>d.status==='入金済み'), unpaid=invs.filter(d=>d.status!=='入金済み');
  const overdue=unpaid.filter(d=>d.due&&d.due<todayISO());
  const amt=d=>docTotals(d).total;
  c.innerHTML=`
    <div class="grid kpis">
      ${kpi('請求件数','🧾',invs.length,'')}${kpi('入金済み','✅',yen(paid.reduce((a,d)=>a+amt(d),0)),`<span class="muted">${paid.length}件</span>`)}
      ${kpi('未入金','⏳',yen(unpaid.reduce((a,d)=>a+amt(d),0)),`<span class="${unpaid.length?'down':'muted'}">${unpaid.length}件</span>`)}
      ${kpi('入金期限超過','⚠️',overdue.length,overdue.length?'<span class="down">要催促</span>':'<span class="up">なし</span>')}
    </div><div style="height:16px"></div>
    ${overdue.length?`<div class="alert bad">⚠️ 入金期限を過ぎた請求: ${overdue.map(d=>esc(d.client)).join('、')}</div>`:''}
    <div class="card"><table>
    <thead><tr><th>番号</th><th>宛先</th><th>発行日</th><th>支払期限</th><th class="num">金額</th><th>状態</th><th>入金日</th>${ed?'<th></th>':''}</tr></thead>
    <tbody>${invs.map(d=>{const od=d.status!=='入金済み'&&d.due&&d.due<todayISO();return `<tr>
      <td><b>${esc(d.number)}</b></td><td>${esc(d.client)}</td><td class="muted" style="font-size:12px">${esc(d.date)}</td>
      <td class="${od?'down':'muted'}" style="font-size:12px">${esc(d.due||'—')}${od?' ⚠️':''}</td><td class="num">${yen(amt(d))}</td>
      <td><span class="pill ${d.status==='入金済み'?'ok':'warn'}">${esc(d.status)}</span></td>
      <td class="muted" style="font-size:12px">${esc(d.paidDate||'—')}</td>
      ${ed?`<td class="row-actions" style="white-space:nowrap">
        ${d.status==='入金済み'?`<button class="icon-btn" title="未入金に戻す" onclick="billMark('${d.id}',false)">↩</button>`:`<button class="icon-btn" title="入金済みにする" onclick="billMark('${d.id}',true)">✓</button>`}
        ${od?`<button class="icon-btn" title="AI催促文" onclick="billDun('${d.id}')">🤖</button>`:''}</td>`:''}
    </tr>`;}).join('')||`<tr><td colspan="${ed?8:7}"><div class="empty">請求書がありません（「AI文書作成」で作成できます）</div></td></tr>`}</tbody></table></div>
    <div class="ai-out" id="bill_ai"></div>`;
}
function billMark(id,paid){ const d=(STORE.documents||[]).find(x=>x.id===id); if(!d)return; d.status=paid?'入金済み':'入金待ち'; d.paidDate=paid?todayISO():''; upsert('documents',d,id); }
async function billDun(id){
  const d=(STORE.documents||[]).find(x=>x.id===id); const out=document.getElementById('bill_ai'); out.className='ai-out show'; out.textContent='生成中…';
  try{ const t=await aiComplete(
    `あなたは経理担当です。入金期限を過ぎた請求への丁寧で角の立たない入金催促メールを日本語で作成します。取引関係を損なわない配慮を。\n【自社情報】\n${orgCtx()}`,
    `請求番号:${d.number}\n宛先:${d.client}\n金額:${yen(docTotals(d).total)}\n支払期限:${d.due}（超過中）\n今日:${todayISO()}\n出力は催促メール本文のみ（件名から）。`,1500);
    out.innerHTML=`<div class="ai-label">💌 ${esc(d.client)}への入金催促文</div>\n`+esc(t)+copyBtn();
  }catch(e){ out.textContent='⚠️ '+e.message; }
}

//==================================================================
// 経費精算
//==================================================================
function renderExpenses(c,p){
  const ed=canEdit('expenses');
  setHeader(p.title,p.sub,ed?`<button class="btn" onclick="editExpense()">＋ 経費を申請</button>`:roBadge());
  const ex=(STORE.expenses||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const sumBy=st=>ex.filter(e=>e.status===st).reduce((a,e)=>a+(+e.amount||0),0);
  c.innerHTML=`
    <div class="grid kpis">
      ${kpi('申請件数','🧾',ex.length,'')}${kpi('申請中','⏳',yen(sumBy('申請中')),`<span class="muted">${ex.filter(e=>e.status==='申請中').length}件</span>`)}
      ${kpi('承認済み','✅',yen(sumBy('承認済み')),'')}${kpi('今月合計','📅',yen(ex.filter(e=>(e.date||'').slice(0,7)===todayISO().slice(0,7)).reduce((a,e)=>a+(+e.amount||0),0)),'')}
    </div><div style="height:16px"></div>
    <div class="card"><table>
    <thead><tr><th>日付</th><th>申請者</th><th>科目</th><th>事業</th><th class="num">金額</th><th>内容</th><th>状態</th>${ed?'<th></th>':''}</tr></thead>
    <tbody>${ex.map(e=>`<tr>
      <td class="muted" style="font-size:12px">${esc(e.date)}</td><td>${esc(e.applicant)}</td><td>${esc(e.category)}</td><td><span class="muted">${esc(e.biz||'—')}</span></td>
      <td class="num">${yen(e.amount)}</td><td class="muted" style="font-size:12px;max-width:180px">${esc(e.note||'')}</td>
      <td><span class="pill ${e.status==='承認済み'?'ok':e.status==='差戻し'?'bad':'warn'}">${esc(e.status)}</span></td>
      ${ed?`<td class="row-actions" style="white-space:nowrap">
        ${e.status==='申請中'?`<button class="icon-btn" title="承認" onclick="expSet('${e.id}','承認済み')">✓</button><button class="icon-btn" title="差戻し" onclick="expSet('${e.id}','差戻し')">↩</button>`:''}
        <button class="icon-btn" onclick="editExpense('${e.id}')">✏️</button><button class="icon-btn" onclick="del('expenses','${e.id}')">🗑</button></td>`:''}
    </tr>`).join('')||`<tr><td colspan="${ed?8:7}"><div class="empty">経費申請がありません</div></td></tr>`}</tbody></table></div>`;
}
function expSet(id,st){ const e=(STORE.expenses||[]).find(x=>x.id===id); if(!e)return; e.status=st; upsert('expenses',e,id); }
function editExpense(id){
  const x=(STORE.expenses||[]).find(e=>e.id===id)||{date:todayISO(),applicant:ME.display_name,category:'交通費',amount:0,biz:'全社',note:'',status:'申請中'};
  const bizOpts=['全社',...(STORE.businesses||[]).map(z=>z.name)];
  openModal(id?'経費を編集':'経費を申請',
    `${field('日付','f_d',x.date,'date')}${field('申請者','f_ap',x.applicant)}
     ${selField('科目','f_cat',x.category,['交通費','会議費','接待交際費','消耗品費','通信費','広告宣伝費','旅費','その他'])}
     ${field('金額(円)','f_amt',x.amount,'number')}${selField('事業','f_biz',x.biz||'全社',bizOpts)}
     <div class="field"><label>内容</label><input id="f_note" value="${esc(x.note||'')}"></div>
     ${ME.role!=='viewer'?selField('状態','f_st',x.status,['申請中','承認済み','差戻し']):''}`,
    ()=>upsert('expenses',{id:id||b(),date:fv('f_d'),applicant:fv('f_ap'),category:fv('f_cat'),amount:fnum('f_amt'),biz:fv('f_biz'),note:fv('f_note'),status:document.getElementById('f_st')?fv('f_st'):x.status,receipt:x.receipt||''},id));
}

//==================================================================
// 勤怠・工数
//==================================================================
function renderTimesheets(c,p){
  const ed=canEdit('timesheets');
  setHeader(p.title,p.sub,ed?`<button class="btn" onclick="editTs()">＋ 工数を記録</button>`:roBadge());
  const ts=(STORE.timesheets||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const today=ts.filter(t=>t.date===todayISO()).reduce((a,t)=>a+(+t.hours||0),0);
  const wkStart=addDays(-((new Date().getDay()+6)%7));
  const week=ts.filter(t=>t.date>=wkStart).reduce((a,t)=>a+(+t.hours||0),0);
  const byBiz={}; ts.filter(t=>t.date>=wkStart).forEach(t=>byBiz[t.biz]=(byBiz[t.biz]||0)+(+t.hours||0));
  c.innerHTML=`
    <div class="grid kpis">
      ${kpi('本日の工数','⏱️',today.toFixed(1)+'h','')}${kpi('今週の工数','📅',week.toFixed(1)+'h','')}
      ${kpi('記録件数','📋',ts.length,'')}${kpi('稼働事業数','🏢',Object.keys(byBiz).length,'')}
    </div><div style="height:16px"></div>
    ${Object.keys(byBiz).length?`<div class="card"><h3>今週の事業別工数</h3>${Object.entries(byBiz).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${esc(k)}</span><b>${v.toFixed(1)}h</b></div><div class="progress"><i style="width:${Math.min(v/week*100,100)}%;background:#4f8cff"></i></div></div>`).join('')}</div><div style="height:16px"></div>`:''}
    <div class="card"><table>
    <thead><tr><th>日付</th><th>担当</th><th>事業</th><th>作業内容</th><th class="num">時間</th>${ed?'<th></th>':''}</tr></thead>
    <tbody>${ts.map(t=>`<tr>
      <td class="muted" style="font-size:12px">${esc(t.date)}</td><td>${esc(t.member)}</td><td><span class="muted">${esc(t.biz)}</span></td>
      <td>${esc(t.task)}</td><td class="num">${(+t.hours||0).toFixed(1)}h</td>
      ${ed?`<td class="row-actions" style="white-space:nowrap"><button class="icon-btn" onclick="editTs('${t.id}')">✏️</button><button class="icon-btn" onclick="del('timesheets','${t.id}')">🗑</button></td>`:''}
    </tr>`).join('')||`<tr><td colspan="${ed?6:5}"><div class="empty">工数記録がありません</div></td></tr>`}</tbody></table></div>`;
}
function editTs(id){
  const x=(STORE.timesheets||[]).find(t=>t.id===id)||{date:todayISO(),member:ME.display_name,biz:'全社',task:'',hours:1,note:''};
  const bizOpts=['全社',...(STORE.businesses||[]).map(z=>z.name)];
  openModal(id?'工数を編集':'工数を記録',
    `${field('日付','f_d',x.date,'date')}${field('担当者','f_m',x.member)}${selField('事業','f_biz',x.biz,bizOpts)}
     ${field('作業内容','f_t',x.task)}${field('時間(h)','f_h',x.hours,'number')}`,
    ()=>upsert('timesheets',{id:id||b(),date:fv('f_d'),member:fv('f_m'),biz:fv('f_biz'),task:fv('f_t'),hours:fnum('f_h'),note:x.note||''},id));
}

//==================================================================
// 定型リマインド
//==================================================================
function renderReminders(c,p){
  const ed=canEdit('reminders');
  setHeader(p.title,p.sub,ed?`<button class="btn" onclick="editRem()">＋ リマインドを追加</button>`:roBadge());
  const rs=(STORE.reminders||[]).slice().sort((a,b)=>(a.next||'9999').localeCompare(b.next||'9999'));
  const due=rs.filter(r=>r.active&&r.next&&r.next<=todayISO());
  c.innerHTML=`
    <div class="grid kpis">
      ${kpi('登録件数','🔔',rs.length,'')}${kpi('期日到来','⚠️',due.length,due.length?'<span class="down">要対応</span>':'<span class="up">なし</span>')}
      ${kpi('有効','✅',rs.filter(r=>r.active).length,'')}${kpi('今月','📅',rs.filter(r=>(r.next||'').slice(0,7)===todayISO().slice(0,7)).length,'')}
    </div><div style="height:16px"></div>
    <div class="card"><table>
    <thead><tr><th>状態</th><th>タイトル</th><th>周期</th><th>次回期日</th><th>分類</th><th>メモ</th>${ed?'<th></th>':''}</tr></thead>
    <tbody>${rs.map(r=>{const od=r.active&&r.next&&r.next<=todayISO();return `<tr style="${r.active?'':'opacity:.5'}">
      <td>${r.active?(od?'<span class="pill warn">期日</span>':'<span class="pill ok">有効</span>'):'<span class="pill muted">停止</span>'}</td>
      <td><b>${esc(r.title)}</b></td><td><span class="muted">${esc(r.cycle)}${r.day?` ${r.day}日`:''}</span></td>
      <td class="${od?'down':'muted'}" style="font-size:12.5px">${esc(r.next||'—')}${od?' ⚠️':''}</td>
      <td><span class="pill muted">${esc(r.category||'—')}</span></td><td class="muted" style="font-size:12px;max-width:180px">${esc(r.note||'')}</td>
      ${ed?`<td class="row-actions" style="white-space:nowrap">
        ${od?`<button class="icon-btn" title="完了→次回へ" onclick="remDone('${r.id}')">✓</button>`:''}
        <button class="icon-btn" title="${r.active?'停止':'再開'}" onclick="remToggle('${r.id}')">${r.active?'⏸':'▶'}</button>
        <button class="icon-btn" onclick="editRem('${r.id}')">✏️</button><button class="icon-btn" onclick="del('reminders','${r.id}')">🗑</button></td>`:''}
    </tr>`;}).join('')||`<tr><td colspan="${ed?7:6}"><div class="empty">リマインドがありません</div></td></tr>`}</tbody></table></div>`;
}
function nextMonthly(day){ const d=new Date(); day=Math.max(1,Math.min(28,+day||1)); if(d.getDate()>day)d.setMonth(d.getMonth()+1); d.setDate(day); return d.toISOString().slice(0,10); }
function nextByCycle(cycle,day,from){ const base=from?new Date(from):new Date(); if(cycle==='毎週'){base.setDate(base.getDate()+7);} else if(cycle==='毎日'){base.setDate(base.getDate()+1);} else if(cycle==='四半期'){base.setMonth(base.getMonth()+3);base.setDate(Math.max(1,Math.min(28,+day||1)));} else {base.setMonth(base.getMonth()+1);base.setDate(Math.max(1,Math.min(28,+day||1)));} return base.toISOString().slice(0,10); }
function remDone(id){ const r=(STORE.reminders||[]).find(x=>x.id===id); if(!r)return; r.next=nextByCycle(r.cycle,r.day,r.next); upsert('reminders',r,id); toast('次回期日に更新しました'); }
function remToggle(id){ const r=(STORE.reminders||[]).find(x=>x.id===id); if(!r)return; r.active=!r.active; upsert('reminders',r,id); }
function editRem(id){
  const x=(STORE.reminders||[]).find(r=>r.id===id)||{title:'',cycle:'毎月',day:25,next:nextMonthly(25),category:'経理',note:'',active:true};
  openModal(id?'リマインドを編集':'リマインドを追加',
    `${field('タイトル','f_t',x.title)}
     <div class="field two"><label>周期 / 日</label><select id="f_cyc">${selOpts(['毎日','毎週','毎月','四半期'],x.cycle)}</select><input id="f_day" type="number" value="${x.day||25}"></div>
     ${field('次回期日','f_next',x.next,'date')}${selField('分類','f_cat',x.category||'経理',['経理','営業','契約','人事','総務','その他'])}
     <div class="field"><label>メモ</label><input id="f_note" value="${esc(x.note||'')}"></div>`,
    ()=>upsert('reminders',{id:id||b(),title:fv('f_t'),cycle:fv('f_cyc'),day:fnum('f_day'),next:fv('f_next'),category:fv('f_cat'),note:fv('f_note'),active:x.active!==false},id));
}

//==================================================================
// 管理者：AI・連携の設定（サイドバー「アカウント管理」の下に統合）
//==================================================================
async function openIntegrations(){
  let s={}; try{ s=await api('GET','/api/integrations'); }catch(e){ alert(e.message); return; }
  const lock=k=>s.env_locked&&s.env_locked[k]?' <span class="pill muted" style="font-size:10px">環境変数で設定済</span>':'';
  openModal('AI・外部連携の設定',
    `<div class="alert info" style="font-size:12.5px">APIキー等はこのサーバー内にのみ保存され、画面には表示されません。空欄のまま保存すると変更しません。環境変数（ANTHROPIC_API_KEY 等）が優先されます。</div>
     <div class="field"><label>Claude APIキー ${s.ai?'<span class="pill ok" style="font-size:10px">設定済</span>':''}${lock('ai_key')}</label><input id="i_ai" type="password" placeholder="${s.ai?'●●●●（変更する場合のみ入力）':'sk-ant-...'}"></div>
     <div class="muted" style="font-size:11px;margin:-6px 0 12px">モデル: ${esc(s.model||'')}（環境変数 CLAUDE_MODEL で変更可）</div>
     <hr style="border-color:var(--line);margin:10px 0">
     <div class="field"><label>Chatwork APIトークン ${s.chatwork?'<span class="pill ok" style="font-size:10px">設定済</span>':''}${lock('chatwork_token')}</label><input id="i_cw" type="password" placeholder="${s.chatwork?'●●●●':'Chatworkの個人トークン'}"></div>
     <div class="field"><label>Slack Botトークン ${s.slack?'<span class="pill ok" style="font-size:10px">設定済</span>':''}${lock('slack_token')}</label><input id="i_sl" type="password" placeholder="${s.slack?'●●●●':'xoxb-...'}"></div>
     <div class="field two"><label>Gmailアドレス / アプリパスワード ${s.gmail?'<span class="pill ok" style="font-size:10px">設定済</span>':''}</label><input id="i_gm_a" placeholder="you@gmail.com" value="${esc(s.gmail_address||'')}"><input id="i_gm_p" type="password" placeholder="${s.gmail?'●●●●':'アプリパスワード16桁'}"></div>
     <div class="muted" style="font-size:11px">※ Slackはbot tokenに im:history,im:read,users:read が必要。GmailはIMAP有効化＋アプリパスワードを使用。`,
    async()=>{ const body={}; const m={i_ai:'ai_key',i_cw:'chatwork_token',i_sl:'slack_token',i_gm_p:'gmail_password'};
      Object.entries(m).forEach(([el,k])=>{ const v=fv(el); if(v)body[k]=v; });
      const ga=fv('i_gm_a'); if(ga!==undefined)body.gmail_address=ga;
      try{ await api('POST','/api/integrations',body); closeModal(); toast('連携設定を保存しました'); }catch(e){ alert(e.message); } });
}

boot();
